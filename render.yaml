services:
  - type: web
    name: lalasynth-master
    runtime: docker
    dockerContext: .
    region: frankfurt
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: TURSO_CONNECTION_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
    healthCheckPath: /
    autoDeploy: true